spring.application.name=api-gate
server.port=9000
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/spring-microservices-security-realm
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/aggregate/product-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/aggregate/order-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/aggregate/inventory-service/v3/api-docs


# =====================================================================
# 1. ACTUATOR ENDPOINT VISIBILITY
# =====================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Enable the specific circuit breakers health component
management.health.circuitbreakers.enabled=true

# =====================================================================
# 2. GLOBAL RESILIENCE4J CONFIGURATION (Binds cleanly to Actuator)
# =====================================================================
# Note: Use config.default (singular config, not configs) for Spring Cloud Starter
resilience4j.circuitbreaker.config.default.registerHealthIndicator=true
resilience4j.circuitbreaker.config.default.slidingWindowSize=10
resilience4j.circuitbreaker.config.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.config.default.failureRateThreshold=50
resilience4j.circuitbreaker.config.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.config.default.automaticTransitionFromOpenToHalfOpenEnabled=true

# Global Time Limiter / Timeout configuration
resilience4j.timelimiter.config.default.timeoutDuration=3s



